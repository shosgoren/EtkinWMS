name: deploy-vps
on:
  # T-925: yalnız `ci` bitince tetiklenir (önceden ci + guards: önce biten tetikleme diğeri sürerken RELEASE_BLOCKED ile düşüyordu);
  # kapı adımı guards kapılarının bitmesini en çok 15 dk bekler.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, deploy]
        default: check
        required: true
      sha:
        description: Exact main commit (deploy only)
        type: string
        required: false
permissions:
  contents: read
  checks: read
# T-445 (kullanıcı kararı 21 Ekim "süreler çok uzun"): eşzamanlılık iş düzeyinde, iki ayrı grup.
#   - `build` (imaj kurulumu, sunucuya dokunmaz): `etkinwms-build`, cancel-in-progress: true — arka arkaya birleşmelerde yeni main
#     gelince eski SHA'nın kapı beklemesi/imaj kurulumu iptal edilir, onun `deploy` işi de koşmaz (needs: build).
#   - `deploy` ve `check` (sunucuya bağlanan işler): `etkinwms-production`, cancel-in-progress: false — ÇALIŞAN yayın (migration dahil)
#     asla iptal edilmez; GitHub grupta en çok bir bekleyen tutar, yeni gelen bekleyen eskisinin yerini alır (başlamamış eski yayın düşer).
#     Böylece yayın sırası seri kalır ve yalnız en son main yayınlanır. Sunucu (release.py) ayrıca NOT_CURRENT_MAIN ile eski SHA'yı reddeder.
jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    concurrency:
      group: etkinwms-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: etkinwms-production
    timeout-minutes: 5
    steps:
      - name: Verify restricted connection
        env:
          DEPLOY_KEY: ${{ secrets.ETKINWMS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ETKINWMS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/key" etkinwms-deploy@187.7.76.72 check
  build:
    # T-445 (security-reviewer MINOR 1): otomatik tetikleme yalnız bu deponun main'ine PUSH ile koşan `ci`'dan; çatal (fork) PR'ın
    # `main` adlı dalından gelen workflow_run iş kuyruğuna hiç girmez (atlanan iş eşzamanlılık grubuna girmez → gerçek build'i iptal edemez).
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'))
    concurrency:
      group: etkinwms-build
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      id-token: write
      attestations: write
    timeout-minutes: 45  # T-925: kapı ≤ 15 dk bekleyebilir + imaj kurulumu
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      schema: ${{ steps.bundle.outputs.schema }}
      digest: ${{ steps.bundle.outputs.digest }}
      digest_voice: ${{ steps.bundle.outputs.digest_voice }}
      voice_tree: ${{ steps.bundle.outputs.voice_tree }}
    steps:
      - name: Gate exact main commit and all required checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api repos/shosgoren/EtkinWMS/git/ref/heads/main --jq .object.sha)
          # T-445: otomatik tetiklemede main ilerlediyse bu SHA yayınlanmaz ve iş kırmızı değil "geçildi" biter (sha çıktısı boş →
          # sonraki adımlar ve deploy koşmaz; yeni main kendi koşusuyla yayınlanır). Elle (workflow_dispatch) istekte eskisi gibi kırmızı.
          if [ "$REQUEST_SHA" != "$main_sha" ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then echo "::notice::SUPERSEDED $REQUEST_SHA (main $main_sha)"; exit 0; fi
            echo "RELEASE_BLOCKED: istenen SHA main değil"; exit 1
          fi
          ancestry=$(gh api "repos/shosgoren/EtkinWMS/compare/024a800bace33c2dc3df397d56fda7e449d1d9dc...$REQUEST_SHA" --jq .status)
          test "$ancestry" = ahead || test "$ancestry" = identical
          # Dokuz kapı: hepsi tamamlanıp başarılı olana kadar en çok 30 × 30 sn bekle; biri başarısızsa hemen dur (fail-closed).
          for attempt in $(seq 1 30); do
            gh api "repos/shosgoren/EtkinWMS/commits/$REQUEST_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
            rc=0
            python3 - "$RUNNER_TEMP/checks.json" <<'PY' || rc=$?
          import json,sys
          checks=json.load(open(sys.argv[1]))['check_runs']
          pending=False
          for name in ['verify','infra','secrets','deps','int','e2e','check-all','test-ac','check-pilot']:
              runs=[r for r in checks if r['name']==name and r.get('app',{}).get('slug')=='github-actions']
              latest=max(runs,key=lambda r:r['id'],default=None)
              if latest is None or latest['status']!='completed':
                  pending=True
                  continue
              if latest['conclusion']!='success':
                  print('RELEASE_BLOCKED:'+name)
                  sys.exit(1)
          sys.exit(3 if pending else 0)
          PY
            if [ "$rc" = 0 ]; then break; fi
            if [ "$rc" != 3 ] || [ "$attempt" = 30 ]; then echo "RELEASE_BLOCKED (rc=$rc)"; exit 1; fi
            sleep 30
          done
          # Bekleme sırasında main ilerlediyse eski SHA için imaj kurulmaz (sunucu da NOT_CURRENT_MAIN ile reddeder).
          main_sha=$(gh api repos/shosgoren/EtkinWMS/git/ref/heads/main --jq .object.sha)
          if [ "$REQUEST_SHA" != "$main_sha" ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then echo "::notice::SUPERSEDED $REQUEST_SHA (main $main_sha)"; exit 0; fi
            echo "RELEASE_BLOCKED: main bekleme sırasında ilerledi"; exit 1
          fi
          echo "sha=$REQUEST_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.sha != ''
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
      - name: Build immutable application and marketing image
        if: steps.gate.outputs.sha != ''
        env:
          RELEASE_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          schema_hash=$(python3 deploy/vps/automation/schema.py packages/db/migrations)
          [[ "$schema_hash" =~ ^[0-9a-f]{64}$ ]]
          python3 -m unittest discover -s deploy/vps/automation -p 'test_*.py'
          bash -n deploy/vps/automation/install-migrate.sh
          docker build --platform linux/amd64 -t "etkinwms-build:$RELEASE_SHA" .
          printf 'FROM etkinwms-build:%s\nCOPY marketing /marketing\n' "$RELEASE_SHA" > "$RUNNER_TEMP/Release.Dockerfile"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$RELEASE_SHA" --label "org.etkinwms.schema.sha256=$schema_hash" -f "$RUNNER_TEMP/Release.Dockerfile" -t "etkinwms:$RELEASE_SHA" .
          # T-916: migration aracı ayrı imaj; aynı imzalı arşivde, aynı revision/schema etiketleriyle.
          docker build --platform linux/amd64 --target migrate --label "org.opencontainers.image.revision=$RELEASE_SHA" --label "org.etkinwms.schema.sha256=$schema_hash" -t "etkinwms-migrate:$RELEASE_SHA" .
          # Migrator smoke: module graph loads (no DB, CLI entry not triggered by import).
          docker run --rm --network none "etkinwms-migrate:$RELEASE_SHA" node --input-type=module -e "await import('/migrator/src/migrate.ts')"
          docker save "etkinwms:$RELEASE_SHA" "etkinwms-migrate:$RELEASE_SHA" | gzip > "$RUNNER_TEMP/image.tar.gz"
          # T-1002 (B-62): iç ses servisi imajı (aynı revision/schema etiketleri + `services/voice` ağaç kimliği). Model derlemede sabit
          # revizyon + SHA-256 ile iner; imaj içinde ağsız birim testi (örnek wav → metin). İkinci arşiv üç imajı taşır; yayın işi onu
          # yalnız alıcı destekliyor ve ses içeriği değiştiyse gönderir (aksi halde sunucudaki önceki ses imajı sürer).
          voice_tree=$(git rev-parse "HEAD:services/voice")
          [[ "$voice_tree" =~ ^[0-9a-f]{40}$ ]]
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$RELEASE_SHA" --label "org.etkinwms.schema.sha256=$schema_hash" --label "org.etkinwms.voice.tree=$voice_tree" -t "etkinwms-voice:$RELEASE_SHA" services/voice
          docker run --rm --network none --read-only --tmpfs /tmp "etkinwms-voice:$RELEASE_SHA" python -m unittest test_app
          docker save "etkinwms:$RELEASE_SHA" "etkinwms-migrate:$RELEASE_SHA" "etkinwms-voice:$RELEASE_SHA" | gzip -1 > "$RUNNER_TEMP/image-voice.tar.gz"
          echo "$voice_tree" > "$RUNNER_TEMP/voice-tree.txt"
          # T-1004: alıcının arşiv sınırları (release.py: manifest.json ≤ 10 000 bayt, imaj yapılandırması ≤ 1 MiB) burada da denetlenir;
          # sınırı aşan arşiv yayına gitmeden derlemede kırmızı olur (önceki koşu sunucuda BAD_MANIFEST ile reddedilmişti).
          for archive in "$RUNNER_TEMP/image.tar.gz" "$RUNNER_TEMP/image-voice.tar.gz"; do
            python3 -I -c 'import json,sys,tarfile
          with tarfile.open(sys.argv[1], "r:gz") as a:
              m = a.getmember("manifest.json")
              assert m.size <= 10000, f"manifest.json {m.size} bayt > 10000"
              for e in json.load(a.extractfile(m)):
                  assert a.getmember(e["Config"]).size <= 1024 * 1024, "imaj yapılandırması > 1 MiB"
              print(sys.argv[1].rsplit("/", 1)[-1], "manifest", m.size, "bayt")' "$archive"
          done
      - name: Record bundle identity
        if: steps.gate.outputs.sha != ''
        id: bundle
        run: |
          set -euo pipefail
          echo "schema=$(python3 deploy/vps/automation/schema.py packages/db/migrations)" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum "$RUNNER_TEMP/image.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "digest_voice=$(sha256sum "$RUNNER_TEMP/image-voice.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "voice_tree=$(cat "$RUNNER_TEMP/voice-tree.txt")" >> "$GITHUB_OUTPUT"
      - name: Sign exact artifact provenance with GitHub OIDC
        if: steps.gate.outputs.sha != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/image.tar.gz
            ${{ runner.temp }}/image-voice.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.gate.outputs.sha != ''
        with:
          name: etkinwms-release
          path: |
            ${{ runner.temp }}/image.tar.gz
            ${{ runner.temp }}/image-voice.tar.gz
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: build
    # T-445: geçilen (SUPERSEDED) SHA'da build sha çıktısı boştur → yayın işi koşmaz.
    if: needs.build.outputs.sha != ''
    concurrency:
      group: etkinwms-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: etkinwms-production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: etkinwms-release
          path: ${{ runner.temp }}/bundle
      - name: Send only the verified image to the fixed release receiver
        env:
          DEPLOY_KEY: ${{ secrets.ETKINWMS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ETKINWMS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          SCHEMA_HASH: ${{ needs.build.outputs.schema }}
          ARCHIVE_HASH: ${{ needs.build.outputs.digest }}
          VOICE_HASH: ${{ needs.build.outputs.digest_voice }}
          VOICE_TREE: ${{ needs.build.outputs.voice_tree }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SCHEMA_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARCHIVE_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VOICE_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VOICE_TREE" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          remote() { ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/key" etkinwms-deploy@187.7.76.72 "$@"; }
          # T-1002: ses imajlı arşiv yalnız alıcı (release.py) ses imajını tanıyorsa ve sunucudaki ses içeriği farklıysa; aksi halde iki imajlı
          # arşiv (eski alıcı da kabul eder). `check` okunamazsa güvenli varsayılan iki imajlı arşivdir.
          check=$(remote check 2>/dev/null || true)
          choice=$(python3 -c 'import json,sys
          try:
              d=json.loads(sys.argv[1].strip().splitlines()[0])
          except Exception:
              d={}
          print("voice" if "etkinwms-voice" in (d.get("images") or []) and d.get("voice_tree")!=sys.argv[2] else "base")' "$check" "$VOICE_TREE")
          if [ "$choice" = voice ]; then file="$RUNNER_TEMP/bundle/image-voice.tar.gz"; hash="$VOICE_HASH"; else file="$RUNNER_TEMP/bundle/image.tar.gz"; hash="$ARCHIVE_HASH"; fi
          echo "arşiv: $choice"
          # T-1004: alıcı aynı SHA'yı "already_deployed" ile arşivi okumadan geçer; ses imajı ilk kez gidecekse yeni bir main commit'i gerekir.
          if [ "$choice" = voice ] && python3 -c 'import json,sys
          try:
              d=json.loads(sys.argv[1].strip().splitlines()[0])
          except Exception:
              d={}
          sys.exit(0 if d.get("release")==sys.argv[2] else 1)' "$check" "$RELEASE_SHA"; then
            echo "::warning::$RELEASE_SHA zaten yayında; alıcı aynı SHA'da arşivi okumaz, ses imajı bir sonraki main commit'iyle gider."
          fi
          test "$(sha256sum "$file" | cut -d' ' -f1)" = "$hash"
          remote "deploy $RELEASE_SHA $hash $SCHEMA_HASH" < "$file"
