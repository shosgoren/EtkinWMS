name: etkinwms-motive

services:
  web:
    image: etkinwms:${WMS_RELEASE:?WMS_RELEASE required}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: /opt/etkinwms/secrets/web.env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose: ["3000"]
    mem_limit: 1536m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ADR-027: yonet.etkinyazilim.com — aynı imaj, panel kipi.
  panel:
    image: etkinwms:${WMS_RELEASE:?WMS_RELEASE required}
    restart: unless-stopped
    env_file: /opt/etkinwms/secrets/web.env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_SURFACE: panel
      BETTER_AUTH_URL: https://yonet.etkinyazilim.com
      # T-995: panelde verilen aktivasyon bağlantısı müşteri uygulamasının adresiyle kurulur.
      WMS_APP_URL: https://wms.etkinyazilim.com
    expose: ["3000"]
    mem_limit: 768m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: etkinwms:${WMS_RELEASE:?WMS_RELEASE required}
    command: ["node", "apps/worker/dist/main.js"]
    restart: unless-stopped
    env_file: /opt/etkinwms/secrets/worker.env
    environment:
      # T-994 (ADR-026 §3): satış sitesi demo talepleri; worker yalnız okur ve platform tablosuna alır. Ayrı birim: bildirim ayarı
      # (notify.json, Resend anahtarı) `marketing-leads`'te kalır ve worker'a hiç bağlanmaz (güvenlik incelemesi m-3).
      DEMO_LEADS_FILE: /leads/demo-requests.jsonl
    volumes:
      - demo-leads:/leads:ro
    depends_on:
      leads-init:
        condition: service_completed_successfully
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # T-994: `demo-leads` birimi kök sahipli oluşur; uygulama kullanıcısı (node) yazabilsin diye bir kez sahipliği verir ve çıkar.
  leads-init:
    image: etkinwms:${WMS_RELEASE:?WMS_RELEASE required}
    user: "0:0"
    command: ["sh", "-c", "chown node:node /leads && chmod 0700 /leads"]
    restart: "no"
    volumes:
      - demo-leads:/leads
    mem_limit: 64m

  marketing:
    image: etkinwms:${WMS_RELEASE:?WMS_RELEASE required}
    command: ["node", "/marketing/server.mjs"]
    restart: unless-stopped
    environment:
      PORT: 3200
      LEAD_DIR: /data
      DEMO_LEADS_DIR: /leads
      # T-407: panelden yayınlanan satış sayfası içeriği (iç ağ; kimliksiz, yalnız yayındaki bilgi).
      SITE_CONTENT_URL: http://web:3000/api/public/site
    volumes:
      - ../../marketing:/marketing:ro
      - marketing-leads:/data
      - demo-leads:/leads
    depends_on:
      leads-init:
        condition: service_completed_successfully
    expose: ["3200"]
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy-data:
  caddy-config:
  marketing-leads:
  demo-leads:
