name: etkinwms
services:
  web:
    image: etkinwms:${WMS_RELEASE:?required}
    restart: unless-stopped
    env_file: /opt/etkinwms/secrets/web.env
    environment: {PORT: 3000, HOSTNAME: 0.0.0.0, NODE_EXTRA_CA_CERTS: /run/etkinwms-db-ca.crt, VOICE_URL: 'http://voice:8000'}
    volumes: [/opt/etkinwms/database/tls/ca.crt:/run/etkinwms-db-ca.crt:ro]
    # T-1002: ses servisine yalnız `voice` iç ağından erişir (o ağda başka servis ve dış çıkış yok).
    networks: [default, voice]
    expose: ['3000']
    mem_limit: 1536m
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD, node, '-e', "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  # ADR-027: yonet.etkinyazilim.com — aynı imaj, panel kipi (yalnız panel sayfaları + giriş), kendi kimlik doğrulama tabanı.
  panel:
    image: etkinwms:${WMS_RELEASE:?required}
    restart: unless-stopped
    env_file: /opt/etkinwms/secrets/web.env
    environment: {PORT: 3000, HOSTNAME: 0.0.0.0, NODE_EXTRA_CA_CERTS: /run/etkinwms-db-ca.crt, APP_SURFACE: panel, BETTER_AUTH_URL: 'https://yonet.etkinyazilim.com', WMS_APP_URL: 'https://wms.etkinyazilim.com'}
    volumes: [/opt/etkinwms/database/tls/ca.crt:/run/etkinwms-db-ca.crt:ro]
    expose: ['3000']
    mem_limit: 768m
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD, node, '-e', "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  worker:
    image: etkinwms:${WMS_RELEASE:?required}
    command: [node, apps/worker/dist/main.js]
    # T-994: demo talepleri ayrı birimden salt okunur (notify.json/Resend anahtarı marketing-leads'te kalır, worker'a bağlanmaz).
    environment: {NODE_EXTRA_CA_CERTS: /run/etkinwms-db-ca.crt, DEMO_LEADS_FILE: /leads/demo-requests.jsonl}
    volumes: [/opt/etkinwms/database/tls/ca.crt:/run/etkinwms-db-ca.crt:ro, demo-leads:/leads:ro]
    depends_on: {leads-init: {condition: service_completed_successfully}}
    env_file: /opt/etkinwms/secrets/worker.env
    restart: unless-stopped
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  # T-994: demo-leads birimi kök sahipli oluşur; node kullanıcısına bir kez sahiplik verir ve çıkar.
  leads-init:
    image: etkinwms:${WMS_RELEASE:?required}
    user: '0:0'
    command: [sh, -c, 'chown node:node /leads && chmod 0700 /leads']
    volumes: [demo-leads:/leads]
    restart: 'no'
    mem_limit: 64m
  marketing:
    image: etkinwms:${WMS_RELEASE:?required}
    command: [node, /marketing/server.mjs]
    # T-407: panelden yayınlanan satış sayfası içeriği (iç ağ; kimliksiz, yalnız yayındaki bilgi).
    environment: {PORT: 3200, LEAD_DIR: /data, DEMO_LEADS_DIR: /leads, SITE_CONTENT_URL: 'http://web:3000/api/public/site'}
    volumes: [marketing-leads:/data, demo-leads:/leads]
    depends_on: {leads-init: {condition: service_completed_successfully}}
    restart: unless-stopped
    mem_limit: 256m
    expose: ['3200']
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  # T-1002 (B-62): Etkin yerel konuşma → yazı (faster-whisper small int8 + Silero VAD; model imajda). Yalnız `voice` iç ağında
  # (internal: dış çıkış yok, DB/Redis ağına bağlı değil), port yayımlanmaz. Yalnız kayıtlı ses imajı varsa başlar (release.py
  # `COMPOSE_PROFILES=voice`). Kaynak sınırı: web/worker aç kalmasın diye CPU payı düşük ve tavanlı, bellek sınırlı, salt okunur kök.
  voice:
    image: etkinwms-voice:${WMS_VOICE_RELEASE:-none}
    profiles: [voice]
    restart: unless-stopped
    networks: [voice]
    expose: ['8000']
    environment: {VOICE_THREADS: '2', VOICE_QUEUE_MAX: '4'}
    read_only: true
    tmpfs: ['/tmp:size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1280m
    cpus: 1.5
    cpu_shares: 256
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
    healthcheck:
      test: [CMD, python, '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
  proxy:
    image: caddy:2
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: [/opt/etkinwms/automation/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: {web: {condition: service_healthy}}
    restart: unless-stopped
    mem_limit: 256m
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
# T-410: uygulama ağı proje adından bağımsız sabit adla (veritabanı projesi bu ağa dış ağ olarak bağlanır).
networks:
  default:
    name: etkinwms_default
  # T-1002: web ↔ voice iç ağı; internal (dış çıkış yok).
  voice:
    name: etkinwms_voice
    internal: true
volumes:
  caddy-data:
  caddy-config:
  marketing-leads:
  demo-leads:
