name: etkinwms-database
services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: etkinwms-postgres
    restart: unless-stopped
    env_file: /opt/etkinwms/database/admin.env
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/tls/server.crt, -c, ssl_key_file=/tls/server.key, -c, shared_buffers=512MB, -c, max_connections=100]
    volumes:
      - postgres-data:/var/lib/postgresql
      - /opt/etkinwms/database/tls:/tls:ro
    networks:
      application:
        aliases: [etkinwms-postgres]
    mem_limit: 2g
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  postgres-data:
networks:
  application:
    external: true
    name: etkinwms-motive_default
