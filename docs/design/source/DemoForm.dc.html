<!-- T-1025: marketing ortak form parçaları; mevcut çalışma zamanı, kullanıcı 22 Ekim kararı. -->
<style>
.demo-options{grid-column:1/-1;border:0;padding:0;margin:0;min-width:0}
.demo-options legend{font-size:14px;font-weight:600;margin-bottom:8px}
.demo-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}
.demo-choice{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:10px;border:2px solid #D2DFE7;border-radius:12px;cursor:pointer;color:#172E42;background:#F5F8FA;font-size:14px}
.demo-choice:has(input:checked){border-color:#1E7A4C;background:#E3F4EA}
.demo-choice input{width:18px;height:18px;accent-color:#1E7A4C;flex:none}
.demo-choice svg{width:24px;height:24px;stroke:#1E7A4C;fill:none;stroke-width:1.8;flex:none}
.demo-choice:focus-within{outline:4px solid #F5C842;outline-offset:2px}
.demo-privacy{position:fixed;inset:0;z-index:1000;background:rgba(15,23,31,.65);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
.demo-privacy[hidden]{display:none}
.demo-privacy-card{background:#FFFFFF;color:#172E42;border-radius:20px;padding:24px;max-width:720px;max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box}
.demo-privacy-card h1{font-size:28px}.demo-privacy-card h2{font-size:20px;margin-top:24px}.demo-privacy-card p{line-height:1.6}
.demo-privacy-card a{display:inline-flex;align-items:center;min-height:48px;color:#172E42;font-weight:700}
.demo-privacy-card :focus-visible{outline:4px solid #F5C842;outline-offset:3px}
</style>
<template id="demo-sector-source">
<fieldset class="demo-options"><legend>{{t.fSector}}</legend><div class="demo-choices">
<sc-for list="{{t.options}}" as="option"><label class="demo-choice"><input type="radio" name="sector" value="{{option.id}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{option.icon}}"></path></svg><span>{{option.n}}</span></label></sc-for>
</div></fieldset>
</template>
<template id="demo-privacy-source">
<div class="demo-privacy" hidden><section class="demo-privacy-card" role="dialog" aria-modal="true" aria-label="Aydınlatma Metni" tabindex="-1">{{privacyContent}}</section></div>
</template>

<template id="demo-fields-source">
      <label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600"><span>{{t.fName}} *</span><input class="field" type="text" name="name" autocomplete="name" required maxlength="100" aria-invalid="{{fe.name}}" aria-describedby="{{fe.nameDesc}}"><sc-if value="{{fe.name}}"><small id="err-name" class="ferr">{{fe.nameMsg}}</small></sc-if></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0"><span>{{t.fCompany}} *</span><input class="field" type="text" name="company" autocomplete="organization" required maxlength="150" aria-invalid="{{fe.company}}" aria-describedby="{{fe.companyDesc}}"><sc-if value="{{fe.company}}"><small id="err-company" class="ferr">{{fe.companyMsg}}</small></sc-if></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0"><span>{{t.fEmail}} *</span><input class="field" type="email" name="email" autocomplete="email" required maxlength="254" aria-invalid="{{fe.email}}" aria-describedby="{{fe.emailDesc}}"><sc-if value="{{fe.email}}"><small id="err-email" class="ferr">{{fe.emailMsg}}</small></sc-if></label>
</template>
