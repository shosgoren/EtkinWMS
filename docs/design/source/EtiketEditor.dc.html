function canEdit(){if(readOnly){toast('Düzenleme yetkin yok');return false}return true}
function remember(){history.push(JSON.stringify(objects));if(history.length>40)history.shift()}
function draw(){const sheet=$('sheet');sheet.replaceChildren();for(const o of objects){const e=document.createElement('div');e.className='object'+(o.id===selected?' active':'');e.dataset.kind=o.kind;e.dataset.id=o.id;e.setAttribute('role','button');e.setAttribute('aria-label',o.kind+' alanı');e.tabIndex=0;e.style.cssText='left:'+o.x+'%;top:'+o.y+'%;width:'+o.w+'%;height:'+o.h+'%;font-size:'+Math.max(12,o.h*1.8)+'px';if(o.kind==='qr')e.innerHTML=QR;else if(o.kind==='barcode')e.textContent='|||||| ||| ||||||';else e.textContent=o.value;e.onpointerdown=ev=>{if(!canEdit())return;selected=o.id;remember();moving={id:o.id,x:ev.clientX,y:ev.clientY,ox:o.x,oy:o.y};e.setPointerCapture(ev.pointerId);updateSelection()};e.onpointermove=ev=>{if(!moving||moving.id!==o.id)return;const r=sheet.getBoundingClientRect();o.x=Math.max(4,Math.min(96-o.w,moving.ox+(ev.clientX-moving.x)/r.width*100));o.y=Math.max(4,Math.min(96-o.h,moving.oy+(ev.clientY-moving.y)/r.height*100));e.style.left=o.x+'%';e.style.top=o.y+'%'};e.onpointerup=()=>{moving=null;draw()};e.onpointercancel=()=>{moving=null;draw()};e.onkeydown=ev=>{if(!canEdit())return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key)){ev.preventDefault();remember();selected=o.id;o.x=Math.max(4,Math.min(96-o.w,o.x+(ev.key==='ArrowRight'?1:ev.key==='ArrowLeft'?-1:0)));o.y=Math.max(4,Math.min(96-o.h,o.y+(ev.key==='ArrowDown'?1:ev.key==='ArrowUp'?-1:0)));draw()}};sheet.append(e)}updateSelection()}
function updateSelection(){document.querySelectorAll('.object').forEach(e=>e.classList.toggle('active',e.dataset.id===selected));const o=objects.find(o=>o.id===selected);$('value').value=o?.value||'';$('value').disabled=readOnly||!o||o.kind==='qr'||o.kind==='barcode'}
$('sheet').onclick=e=>{if(e.target!==$('sheet')||!canEdit())return;const o=objects.find(o=>o.id===selected);if(!o)return;const r=$('sheet').getBoundingClientRect();remember();o.x=Math.max(4,Math.min(96-o.w,(e.clientX-r.left)/r.width*100-o.w/2));o.y=Math.max(4,Math.min(96-o.h,(e.clientY-r.top)/r.height*100-o.h/2));draw()};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(!canEdit())return;remember();const kind=b.dataset.add;selected='o'+Date.now();objects.push({id:selected,kind,x:8,y:15,w:kind==='qr'?24:40,h:kind==='qr'?48:18,value:kind==='logo'?'LOGO':'Yeni metin'});draw()});
$('value').onchange=()=>{if(!canEdit())return;const o=objects.find(o=>o.id===selected);if(o){remember();o.value=$('value').value;draw()}};
function closeProperties(){document.querySelector('.inspector').classList.remove('open');document.body.classList.remove('property-open');$('edit-selected').focus()}$('edit-selected').onclick=()=>{if(!canEdit())return;document.querySelector('.inspector').classList.add('open');document.body.classList.add('property-open');$('value').focus()};$('close-properties').onclick=closeProperties;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('property-open'))closeProperties()});
$('undo').onclick=()=>{if(!canEdit()||!history.length)return;objects=JSON.parse(history.pop());draw()};$('reset').onclick=()=>{if(!canEdit())return;remember();objects=initial();selected='name';draw()};$('copy').onclick=()=>{if(!canEdit())return;const o=objects.find(o=>o.id===selected);if(o){remember();selected='o'+Date.now();objects.push({...o,id:selected,x:Math.min(96-o.w,o.x+3),y:Math.min(96-o.h,o.y+3)});draw()}};$('remove').onclick=()=>{if(!canEdit())return;remember();objects=objects.filter(o=>o.id!==selected);selected=objects[0]?.id;draw()};$('center').onclick=()=>{if(!canEdit())return;const o=objects.find(o=>o.id===selected);if(o){remember();o.x=(100-o.w)/2;draw()}};$('nudge').onclick=()=>{if(!canEdit())return;const o=objects.find(o=>o.id===selected);if(o){remember();o.x=Math.min(96-o.w,o.x+2);draw()}};
for(const id of ['width','height'])$(id).onchange=()=>{if(!canEdit())return;const w=Number($('width').value),h=Number($('height').value);if(w<30||w>200||h<30||h>200){toast('Örnekte ölçü 30–200 mm olmalı');return}$('sheet').style.aspectRatio=w+'/'+h;$('size-summary').textContent=w+' × '+h+' mm · Örnek'};
document.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-context]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));toast(b.textContent+' tasarımı · örnek')});$('printer').onclick=()=>{if(!canEdit())return;const open=$('printers').classList.toggle('open');$('printer').setAttribute('aria-expanded',String(open))};document.querySelectorAll('[data-printer]').forEach(b=>b.onclick=()=>{if(!canEdit())return;$('printer-name').textContent=b.dataset.printer;$('printers').classList.remove('open');$('printer').setAttribute('aria-expanded','false')});$('theme').onclick=()=>document.body.classList.toggle('dark');$('save').onclick=()=>{if(canEdit())toast('Tasarım örneği · sunucuya kaydedilmedi')};$('preview').onclick=()=>toast('Önizleme · gerçek yazıcıya gönderilmedi');$('home').onclick=$('back').onclick=()=>toast('Tasarım örneği · uygulama geçişi yok');draw();
</script></body></html>
